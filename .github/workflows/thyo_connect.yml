name: RDP Direct Pinggy

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Lancer le tunnel TCP Pinggy
        run: |
          ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@a.pinggy.io > pinggy.log 2>&1 &
          Start-Sleep -Seconds 15
          Get-Content pinggy.log

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
