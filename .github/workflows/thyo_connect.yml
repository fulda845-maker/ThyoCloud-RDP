name: RDP Direct Serveo

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Lancer le tunnel Serveo et Afficher l'adresse
        run: |
          $process = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net" -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "=========================================="
          Write-Host "UTILISEZ SERVEO POUR VOUS CONNECTER"
          Write-Host "=========================================="

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
