name: RDP Direct Ngrok

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Installer Ngrok
        run: |
          choco install ngrok -y

      - name: Lancer Ngrok et recuperer l'adresse
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $env:NGROK_TOKEN
          Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout"
          
          $publicUrl = ""
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 3
            try {
              $response = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
              $publicUrl = $response.tunnels[0].public_url
              if ($publicUrl) { break }
            } catch {
              Write-Host "Attente du demarrage de Ngrok..."
            }
          }

          if ($publicUrl) {
            Write-Host "=========================================="
            Write-Host "VOTRE ADRESSE RDP : $publicUrl"
            Write-Host "=========================================="
          } else {
            Write-Error "Ngrok n'a pas pu demarrer. Verifiez la cle NGROK_AUTH_TOKEN dans vos secrets GitHub."
          }

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
