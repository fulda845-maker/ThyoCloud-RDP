name: RDP Direct Localtonet

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Installer et Lancer Localtonet
        run: |
          Invoke-WebRequest -Uri "https://localtonet.com/download/localtonet-win-x64.zip" -OutFile "localtonet.zip"
          Expand-Archive -Path "localtonet.zip" -DestinationPath "."
          Start-Process -FilePath ".\localtonet.exe" -ArgumentList "authtoken RCZ6W8fya0FLYXtBgv3jdUJ7Oklxo9uKA" -NoNewWindow
          Start-Sleep -Seconds 5
          Start-Process -FilePath ".\localtonet.exe" -ArgumentList "start all" -NoNewWindow

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
