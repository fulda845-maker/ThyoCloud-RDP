name: RDP Direct Loophole

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Telecharger et Lancer Loophole
        run: |
          Invoke-WebRequest -Uri "https://github.com/loophole/cli/releases/download/v1.0.0-beta.14/loophole_1.0.0-beta.14_windows_amd64.zip" -OutFile "loophole.zip"
          Expand-Archive -Path "loophole.zip" -DestinationPath "."
          Start-Process -FilePath ".\loophole.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
