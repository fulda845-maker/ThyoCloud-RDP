name: RDP Direct Localtonet SSH

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: windows-latest
    steps:
      - name: Activer le bureau a distance (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Creer l'utilisateur Administrateur
        run: |
          net user AdminRdp Pass2026! /add
          net localgroup Administrators AdminRdp /add

      - name: Lancer le tunnel SSH Localtonet
        run: |
          $process = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 223 RCZ6W8fya0FLYXtBgv3jdUJ7Oklxo9uKA@localtonet.com" -PassThru -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Maintien du serveur actif (6h)
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
